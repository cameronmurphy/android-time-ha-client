name: Lint and test

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The release signing key lives outside the repo, so a release build here would silently
      # fall back to the debug key. Debug variants are what CI should be checking anyway.
      - name: Run test suite
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build
        run: ./gradlew :app:assembleDebug

  # Kept separate from the fast checks: this one boots an emulator, so it takes minutes
  # rather than seconds and should not hold up lint feedback.
  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The emulator needs hardware acceleration to be anything other than unusably slow.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: app/build/outputs/androidTest-results
