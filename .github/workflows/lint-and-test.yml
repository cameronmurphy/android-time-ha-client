name: Lint and test

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The release signing key lives outside the repo, so a release build here would silently
      # fall back to the debug key. Debug variants are what CI should be checking anyway.
      - name: Run test suite
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build
        run: ./gradlew :app:assembleDebug
