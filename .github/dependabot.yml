version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 20

  # The root build.gradle.kts holds the Android Gradle plugin and Kotlin versions; app/ holds
  # the test dependencies. Ungrouped, so a major arrives on its own — an AGP or Kotlin bump is
  # worth looking at by itself, since either can need source changes.
  #
  # This also covers the Gradle wrapper itself, which arrives as its own pull request.
  # Note an AGP major can require a newer Gradle than the wrapper pins, in which case the
  # two have to land together rather than one at a time.
  - package-ecosystem: 'gradle'
    directories:
      - '/'
      - '/app'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 20
