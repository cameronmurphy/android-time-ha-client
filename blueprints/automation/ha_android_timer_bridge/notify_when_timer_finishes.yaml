blueprint:
  name: Notify when a tablet timer finishes
  description: >-
    Runs an action whenever a Google Assistant or Clock timer finishes on a tablet running
    the HA Android Timer Bridge app. The timer's name is available to your action as the variable
    `timer_name`, falling back to "Timer" when the timer was unnamed.
  domain: automation
  input:
    timer_entity:
      name: Timer event entity
      description: The Timer entity belonging to the tablet.
      selector:
        entity:
          filter:
            - integration: ha_android_timer_bridge
              domain: event
    notify_action:
      name: Action to run
      description: >-
        Usually one notify action per phone, for example notify.mobile_app_your_iphone.
        Use {{ timer_name }} in the title or message.
      selector:
        action: {}

mode: queued
max: 10

variables:
  timer_entity: !input timer_entity
  timer_name: "{{ state_attr(timer_entity, 'timer_name') or 'Timer' }}"

trigger:
  - platform: state
    entity_id: !input timer_entity

condition:
  # An event entity's state is the timestamp of the last event; ignore start-up churn.
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.from_state is not none
         and trigger.from_state.state != trigger.to_state.state }}

action: !input notify_action
